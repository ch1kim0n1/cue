name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in main.js preload.js renderer/*.js src/*.js test/*.js scripts/*.js e2e/*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: ESLint security pass
        run: npm run lint

      - name: Verify vendored assets
        run: npm run verify:vendor

      - name: Run unit tests
        run: npm test

      - name: Run main-process smoke tests
        run: npm run test:smoke

      - name: Audit production dependencies (fail on high+)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Electron UI (Playwright)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Electron binary if missing
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) {
            node node_modules/electron/install.js
          }
      - name: Run Playwright Electron tests
        run: npm run test:e2e
        env:
          CUE_NO_PROTECT: "1"

      - name: Pack and run packaged asar e2e
        run: npm run test:e2e:packed
        env:
          CUE_NO_PROTECT: "1"
