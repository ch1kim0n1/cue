name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Supported matrix: Node 18/20/22 with Electron 33.2.1 (see package.json engines)
        node-version: [18, 20, 22]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in main.js preload.js renderer/*.js src/*.js test/*.js scripts/*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: Verify vendored assets
        run: npm run verify:vendor

      - name: Run unit tests
        run: npm test

      - name: Run main-process smoke tests
        run: npm run test:smoke

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
