name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    env:
      MAC_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' }}
      WIN_SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK != '' || secrets.CSC_LINK != '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests before packaging
        run: |
          npm run lint
          npm test
          npm run test:smoke
          npm run verify:vendor
          npm audit --omit=dev --audit-level=high

      - name: Generate SBOM
        run: npm run sbom

      - name: Build macOS (arm64 + x64 zips)
        if: matrix.os == 'macos-latest'
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGN: ${{ secrets.CSC_LINK != '' && '1' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}

      - name: Verify Windows Authenticode signature
        if: matrix.os == 'windows-latest' && env.WIN_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw 'No Windows exe found to verify' }
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -Path $kits -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found under Windows Kits' }
          Write-Host "Using $($signtool.FullName)"
          & $signtool.FullName verify /pa $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit $LASTEXITCODE" }

      - name: Staple macOS notarization ticket
        if: matrix.os == 'macos-latest' && env.MAC_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          stapled=0
          for app in dist/mac*/Cue.app; do
            echo "Stapling $app"
            xcrun stapler staple "$app"
            spctl --assess --verbose --type execute "$app"
            stapled=1
          done
          if [ "$stapled" -eq 0 ]; then
            for zip in dist/*.zip; do
              tmp=$(mktemp -d)
              unzip -q "$zip" -d "$tmp"
              app=$(find "$tmp" -name 'Cue.app' -type d | head -n 1)
              if [ -z "$app" ]; then
                echo "No Cue.app inside $zip"
                rm -rf "$tmp"
                continue
              fi
              echo "Stapling $app from $zip"
              xcrun stapler staple "$app"
              spctl --assess --verbose --type execute "$app"
              (
                cd "$tmp"
                rm -f "$OLDPWD/$zip"
                zip -qry "$OLDPWD/$zip" .
              )
              rm -rf "$tmp"
              stapled=1
            done
          fi
          if [ "$stapled" -eq 0 ]; then
            echo "No Cue.app found to staple after signed mac build"
            exit 1
          fi

      - name: Upload to GitHub Release
        if: matrix.os != 'macos-latest' || env.MAC_SIGNING_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            bom.cdx.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
